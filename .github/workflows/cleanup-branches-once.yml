name: One-time branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.head_commit.message == 'chore: cleanup stale branches' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in "cmdb-hardening-20261006" "fix/breezy-sessions-migration"; do
            curl --fail-with-body -L \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done
